name: 'Manjaro Iso Action'
description: 'Installs prerequisites for building Manjaro on ubuntu'

inputs:
  iso-profiles-repo:
    description: 'iso profiles to clone'
    required: false
    default: 'https://gitlab.manjaro.org/profiles-and-settings/iso-profiles'
  iso-profiles-branch:
    description: 'branch of the iso profiles to check out'
    required: false
  edition:
    description: 'name of the iso profile to build'
    required: true
  branch:
    description: 'stable (default), testing, unstable'
    required: false
    default: stable
  scope:
    description: 'full (default) or minimal image'
    required: false
    default: full
  version:
    description: 'dist_release version (upstream if not given)'
    required: false
  kernel:
    description: 'kernel version'
    required: false
    default: linux510
  code-name:
    description: 'manjaro code-name (upstream if not given)'
    required: false
  release-tag:
    description: 'release tag to upload to (if set)'
    required: false
  custom-repo:
    description: 'name a custom repo to be prioritized above the default ones'
    required: false
  office-chooser:
    description: 'include calamares office installer module'
    required: false
    default: "false"
  build-mirror:
    description: 'specific build mirror to use'
    required: false
    default: https://mirror.easyname.at/manjaro
  pacman-version:
    description: 'pacman version to build ("latest" to auto-detect)'
    required: false
    default: latest
  pacman-detect-urls:
    description: 'space separated fallback URLs used to resolve latest pacman version when pacman-version=latest (expects directory index with pacman-package-manager_<ver>.orig.tar.*)'
    required: false
    default: "https://ftp.debian.org/debian/pool/main/p/pacman-package-manager/ https://ftp.ubuntu.com/ubuntu/pool/universe/p/pacman-package-manager/"
  pacman-source-urls:
    description: 'space separated fallback URLs to download pacman source tarball; use {version} placeholder'
    required: false
    default: "https://ftp.debian.org/debian/pool/main/p/pacman-package-manager/pacman-package-manager_{version}.orig.tar.xz https://ftp.debian.org/debian/pool/main/p/pacman-package-manager/pacman-package-manager_{version}.orig.tar.gz https://ftp.ubuntu.com/ubuntu/pool/universe/p/pacman-package-manager/pacman-package-manager_{version}.orig.tar.xz https://ftp.ubuntu.com/ubuntu/pool/universe/p/pacman-package-manager/pacman-package-manager_{version}.orig.tar.gz https://gitlab.archlinux.org/pacman/pacman/-/releases/v{version}/downloads/pacman-{version}.tar.xz https://sources.archlinux.org/other/pacman/pacman-{version}.tar.xz"
  archlinux-core-db-urls:
    description: 'space separated fallback URLs to Arch core.db (x86_64) used to resolve the latest archlinux-keyring package'
    required: false
    default: "https://mirrors.edge.kernel.org/archlinux/core/os/x86_64/core.db https://mirrors.ocf.berkeley.edu/archlinux/core/os/x86_64/core.db"
  gpg-secret-key-base64:
    description: 'base64 encoded gpg secret key (without a passphrase) to sign the zip (if set)'
    required: false
  gpg-passphrase:
    description: 'phrase to decrypt the gpg secret key if given'
    required: false
  additional-trusted-gpg:
    description: 'gpg keyids that pacman should trust'
    required: false
  cdn77-host:
    description: 'cdn77 upload credentials'
    required: false
  cdn77-user:
    description: 'cdn77 upload credentials'
    required: false
  cdn77-pwd:
    description: 'cdn77 upload credentials'
    required: false
  sf-project:
    description: 'sf upload credentials'
    required: false
  sf-user:
    description: 'sf upload credentials'
    required: false
  sf-key:
    description: 'sf upload credentials'
    required: false
  osdn-project:
    description: 'osdn upload credentials'
    required: false
  osdn-user:
    description: 'osdn upload credentials'
    required: false
  osdn-key:
    description: 'osdn upload credentials'
    required: false
  s3-cfg:
    description: 'S3 config'
    required: false

outputs:
  file-path:
    description: "path of the generated iso"
    value: ${{ steps.image-build.outputs.file-path }}

runs:
  using: "composite"
  steps:
    - id: install-build-dependencies
      shell: bash
      run: |
        # Ensure script is LF-only to avoid CRLF parsing errors
        if grep -q $'\r' "$0"; then
          exec bash -c "$(tr -d '\r' < "$0")" "$@"
        fi
        sudo apt-get update
        sudo apt-get install -y \
          gdisk \
          zip \
          systemd-container \
          bmap-tools \
          asciidoc \
          libarchive-tools \
          git \
          build-essential \
          cmake \
          libarchive-dev \
          pkg-config \
          libcurl4-openssl-dev \
          libgpgme-dev \
          libssl-dev \
          fakeroot \
          dh-autoreconf \
          haveged \
          os-prober \
          kwalify \
          dosfstools \
          libisoburn1 \
          squashfs-tools \
          docbook2x \
          mktorrent \
          doxygen \
          zstd \
          s3cmd \
          xorriso \
          wget \
          curl \
          meson \
          ninja-build

    - id: install-pacman
      shell: bash
      env:
        PACMAN_VERSION: ${{ inputs.pacman-version }}
        PACMAN_DETECT_URLS: ${{ inputs.pacman-detect-urls }}
        PACMAN_SOURCE_URLS: ${{ inputs.pacman-source-urls }}
      run: |
        # Ensure script is LF-only
        if grep -q $'\r' "$0"; then
          exec bash -c "$(tr -d '\r' < "$0")" "$@"
        fi
        # Helper functions for reliable downloads
        retry_git_clone() {
          local max_attempts=5 attempt=1 delay=10
          until sudo git clone --depth 1 "$@"; do
            if [ $attempt -ge $max_attempts ]; then
              echo "ERROR: git clone failed after $max_attempts attempts" >&2
              return 1
            fi
            echo "git clone failed, retrying in ${delay}s (attempt $attempt/$max_attempts)..." >&2
            sleep $delay
            delay=$((delay * 2))
            attempt=$((attempt + 1))
          done
        }

        retry_wget() {
          local output="$1" url="$2"
          shift 2
          local max_attempts=5 attempt=1 delay=10
          rm -f "$output"
          while [ $attempt -le $max_attempts ]; do
            if wget --timeout=30 -O "$output" "$@" "$url"; then
              return 0
            fi
            echo "wget failed, retrying in ${delay}s (attempt $attempt/$max_attempts)..." >&2
            sleep $delay
            delay=$((delay * 2))
            attempt=$((attempt + 1))
          done
          echo "ERROR: wget failed after $max_attempts attempts" >&2
          return 1
        }

        retry_curl() {
          local url="$1"
          shift
          local max_attempts=5 attempt=1 delay=10
          while [ $attempt -le $max_attempts ]; do
            if curl --retry 5 --retry-delay 10 --retry-connrefused -fsSL "$@" "$url"; then
              return 0
            fi
            echo "curl failed, retrying in ${delay}s (attempt $attempt/$max_attempts)..." >&2
            sleep $delay
            delay=$((delay * 2))
            attempt=$((attempt + 1))
          done
          echo "ERROR: curl failed after $max_attempts attempts" >&2
          return 1
        }

        retry_git_clone https://gitlab.manjaro.org/packages/core/pacman.git
        pushd pacman
          UA="Mozilla/5.0"
          PACMAN_VER="${PACMAN_VERSION}"

          # Auto-detect latest if requested
          if [ -z "${PACMAN_VER}" ] || [ "${PACMAN_VER}" = "latest" ]; then
            echo "## pacman: resolving latest version"
            PACMAN_VER=""
            for u in ${PACMAN_DETECT_URLS}; do
              echo "## pacman: detect from ${u}"
              idx="$(retry_curl "${u}" -A "${UA}" 2>/dev/null || true)"
              [ -z "${idx}" ] && continue
              ver="$(printf '%s' "${idx}" \
                | grep -Eo 'pacman-package-manager_[0-9]+\.[0-9]+\.[0-9]+\.orig\.tar\.(xz|gz|bz2)' \
                | sed -E 's/^pacman-package-manager_([0-9]+\.[0-9]+\.[0-9]+)\.orig\.tar\..*$/\1/' \
                | sort -V \
                | tail -n 1 \
                || true)"
              if [ -n "${ver}" ]; then
                PACMAN_VER="${ver}"
                break
              fi
            done
            if [ -z "${PACMAN_VER}" ]; then
              echo "ERROR: Could not resolve latest pacman version" >&2
              exit 1
            fi
          fi

          echo "## pacman: version ${PACMAN_VER}"

          # Download source tarball from fallback list
          dl_ok=0
          tmp_tar="/tmp/pacman-src.tar.xz"
          rm -f "${tmp_tar}"
          for tmpl in ${PACMAN_SOURCE_URLS}; do
            url="${tmpl//\{version\}/${PACMAN_VER}}"
            echo "## pacman: trying ${url}"
            if retry_wget "${tmp_tar}" "${url}" --user-agent="${UA}" -q; then
              dl_ok=1
              break
            fi
          done
          if [ "${dl_ok}" -ne 1 ]; then
            echo "ERROR: Could not download pacman source for ${PACMAN_VER}" >&2
            exit 1
          fi

          # Determine top directory safely (no SIGPIPE issue)
          topdir="$(tar -tf "${tmp_tar}" 2>/dev/null | sed -n '1p' | cut -d/ -f1)"
          if [ -z "${topdir}" ]; then
            echo "ERROR: Could not determine source top directory" >&2
            exit 1
          fi

          sudo tar -xvf "${tmp_tar}"
          pushd "${topdir}"
            sudo meson --prefix=/usr \
                      --buildtype=plain \
                      -Ddoc=disabled \
                      -Ddoxygen=enabled \
                      -Dscriptlet-shell=/usr/bin/bash \
                      -Dldconfig=/usr/bin/ldconfig \
                      build
            sudo meson compile -C build
            sudo meson install -C build
          popd

          sudo install -m644 pacman.conf /etc/pacman.conf
          sudo install -m644 makepkg.conf /etc/
          sudo mkdir -p /etc/pacman.d
          sudo touch /etc/pacman.d/mirrorlist

          # Pacman 7+ requires alpm user/group
          sudo install -dm755 /var/empty
          getent group alpm >/dev/null 2>&1 || sudo groupadd -r alpm
          id -u alpm >/dev/null 2>&1 || sudo useradd -r -g alpm -M -d /var/empty -s /usr/sbin/nologin alpm
        popd

    - id: install-keyrings
      shell: bash
      run: |
        # Ensure script is LF-only
        if grep -q $'\r' "$0"; then
          exec bash -c "$(tr -d '\r' < "$0")" "$@"
        fi
        retry_git_clone() {
          local max_attempts=5 attempt=1 delay=10
          until sudo git clone --depth 1 "$@"; do
            if [ $attempt -ge $max_attempts ]; then
              echo "ERROR: git clone failed after $max_attempts attempts" >&2
              return 1
            fi
            echo "git clone failed, retrying in ${delay}s (attempt $attempt/$max_attempts)..." >&2
            sleep $delay
            delay=$((delay * 2))
            attempt=$((attempt + 1))
          done
        }

        retry_wget() {
          local output="$1" url="$2"
          shift 2
          local max_attempts=5 attempt=1 delay=10
          rm -f "$output"
          while [ $attempt -le $max_attempts ]; do
            if wget --timeout=30 -O "$output" "$@" "$url"; then
              return 0
            fi
            echo "wget failed, retrying in ${delay}s (attempt $attempt/$max_attempts)..." >&2
            sleep $delay
            delay=$((delay * 2))
            attempt=$((attempt + 1))
          done
          echo "ERROR: wget failed after $max_attempts attempts" >&2
          return 1
        }

        sudo install -dm755 /usr/share/pacman/keyrings/

        # Manjaro keyring
        retry_git_clone https://gitlab.manjaro.org/packages/core/manjaro-keyring.git
        pushd manjaro-keyring
          sudo install -m0644 manjaro.gpg /usr/share/pacman/keyrings/
          sudo install -m0644 manjaro-trusted /usr/share/pacman/keyrings/
          sudo install -m0644 manjaro-revoked /usr/share/pacman/keyrings/
        popd

        # Dynamically resolve latest archlinux-keyring
        mkdir -p archlinux-keyring
        pushd archlinux-keyring
          ARCH_CORE_DB_URLS="${{ inputs.archlinux-core-db-urls }}"
          UA="Mozilla/5.0"
          tmpdb="$(mktemp)"
          tmpdesc="$(mktemp)"
          pkgfile=""

          for dburl in ${ARCH_CORE_DB_URLS}; do
            echo "## archlinux-keyring: trying core.db ${dburl}"
            if retry_wget "${tmpdb}" "${dburl}" --user-agent="${UA}" -q; then
              entry="$(bsdtar -tf "${tmpdb}" 2>/dev/null | grep -E '^archlinux-keyring-[^/]+/desc$' | head -n 1 || true)"
              if [ -n "${entry}" ]; then
                bsdtar -xOf "${tmpdb}" "${entry}" > "${tmpdesc}" 2>/dev/null || true
                pkgfile="$(awk '$0=="%FILENAME%"{getline; print; exit}' "${tmpdesc}" || true)"
                if [ -n "${pkgfile}" ]; then
                  echo "## archlinux-keyring: latest package ${pkgfile}"
                  break
                fi
              fi
            fi
          done

          if [ -z "${pkgfile}" ]; then
            echo "ERROR: Could not resolve latest archlinux-keyring from core.db" >&2
            exit 1
          fi

          dl_ok=0
          for dburl in ${ARCH_CORE_DB_URLS}; do
            base="${dburl%/*}"
            pkgurl="${base}/${pkgfile}"
            echo "## archlinux-keyring: trying package ${pkgurl}"
            if retry_wget "/tmp/archlinux-keyring.tar.zst" "${pkgurl}" --user-agent="${UA}" -q; then
              dl_ok=1
              break
            fi
          done

          rm -f "${tmpdb}" "${tmpdesc}"

          if [ "${dl_ok}" -ne 1 ]; then
            echo "ERROR: Could not download ${pkgfile} from configured mirrors" >&2
            exit 1
          fi

          tar --use-compress-program=unzstd --strip-components=4 --wildcards -xvf /tmp/archlinux-keyring.tar.zst usr/share/pacman/keyrings/*
          sudo install -m0644 archlinux.gpg /usr/share/pacman/keyrings/
          sudo install -m0644 archlinux-trusted /usr/share/pacman/keyrings/
          sudo install -m0644 archlinux-revoked /usr/share/pacman/keyrings/
        popd

        sudo pacman-key --init
        sudo pacman-key --populate archlinux manjaro

        # Trust additional GPG keys with fallback
        for gpg_key in ${{ inputs.additional-trusted-gpg }}; do
          sudo pacman-key --keyserver keys.openpgp.org --recv-key $gpg_key || \
          sudo pacman-key --keyserver keyserver.ubuntu.com --recv-key $gpg_key
          sudo pacman-key --lsign-key $gpg_key
        done

    - id: install-arch-install-scripts
      shell: bash
      env:
        VERSION: "27"
      run: |
        # Ensure script is LF-only
        if grep -q $'\r' "$0"; then
          exec bash -c "$(tr -d '\r' < "$0")" "$@"
        fi
        retry_wget() {
          local output="$1" url="$2"
          shift 2
          local max_attempts=5 attempt=1 delay=10
          rm -f "$output"
          while [ $attempt -le $max_attempts ]; do
            if wget --timeout=30 -O "$output" "$@" "$url"; then
              return 0
            fi
            echo "wget failed, retrying in ${delay}s (attempt $attempt/$max_attempts)..." >&2
            sleep $delay
            delay=$((delay * 2))
            attempt=$((attempt + 1))
          done
          echo "ERROR: wget failed after $max_attempts attempts" >&2
          return 1
        }

        retry_wget arch-install-scripts.tar.gz "https://github.com/archlinux/arch-install-scripts/archive/refs/tags/v${VERSION}.tar.gz"
        sudo tar -xvf arch-install-scripts.tar.gz
        sudo make -C arch-install-scripts-${VERSION}
        sudo make -C arch-install-scripts-${VERSION} check
        sudo make -C arch-install-scripts-${VERSION} PREFIX=/usr install
        
        # Download with retry (URL fixed to raw in previous PR)
        for attempt in $(seq 1 5); do
          if sudo wget --timeout=30 -O /etc/pacman-mirrors.conf "https://gitlab.manjaro.org/applications/pacman-mirrors/-/raw/master/data/etc/pacman-mirrors.conf"; then
            break
          fi
          echo "wget failed, retrying in 10s (attempt $attempt/5)..." >&2
          sleep 10
        done || { echo "ERROR: failed to download pacman-mirrors.conf" >&2; exit 1; }

    - id: install-calamares-tools
      shell: bash
      run: |
        # Ensure script is LF-only
        if grep -q $'\r' "$0"; then
          exec bash -c "$(tr -d '\r' < "$0")" "$@"
        fi
        retry_git_clone() {
          local max_attempts=5 attempt=1 delay=10
          until sudo git clone --depth 1 "$@"; do
            if [ $attempt -ge $max_attempts ]; then
              echo "ERROR: git clone failed after $max_attempts attempts" >&2
              return 1
            fi
            echo "git clone failed, retrying in ${delay}s (attempt $attempt/$max_attempts)..." >&2
            sleep $delay
            delay=$((delay * 2))
            attempt=$((attempt + 1))
          done
        }
        retry_git_clone https://gitlab.manjaro.org/applications/calamares-tools.git
        
        cd calamares-tools
        sudo install -d /usr/share/calamares/
        sudo cp -rv schemas/ /usr/share/calamares/

    - id: install-mkinitcpio
      shell: bash
      env:
        VERSION: "32"
      run: |
        # Ensure script is LF-only
        if grep -q $'\r' "$0"; then
          exec bash -c "$(tr -d '\r' < "$0")" "$@"
        fi
        retry_wget() {
          local output="$1" url="$2"
          shift 2
          local max_attempts=5 attempt=1 delay=10
          rm -f "$output"
          while [ $attempt -le $max_attempts ]; do
            if wget --timeout=30 -O "$output" "$@" "$url"; then
              return 0
            fi
            echo "wget failed, retrying in ${delay}s (attempt $attempt/$max_attempts)..." >&2
            sleep $delay
            delay=$((delay * 2))
            attempt=$((attempt + 1))
          done
          echo "ERROR: wget failed after $max_attempts attempts" >&2
          return 1
        }

        retry_wget mkinitcpio-v${VERSION}.tar.gz "https://gitlab.archlinux.org/archlinux/mkinitcpio/mkinitcpio/-/archive/v${VERSION}/mkinitcpio-v${VERSION}.tar.gz"
        sudo tar -xf mkinitcpio-v${VERSION}.tar.gz
        sudo make -C mkinitcpio-v${VERSION} install
        sudo sed -i -e 's|File|Path|' /usr/share/libalpm/hooks/*hook

    - id: install-manjaro-tools
      shell: bash
      env:
        CUSTOM_REPO: ${{ inputs.custom-repo }}
      run: |
        # Ensure script is LF-only
        if grep -q $'\r' "$0"; then
          exec bash -c "$(tr -d '\r' < "$0")" "$@"
        fi
        retry_git_clone() {
          local max_attempts=5 attempt=1 delay=10
          until sudo git clone --depth 1 "$@"; do
            if [ $attempt -ge $max_attempts ]; then
              echo "ERROR: git clone failed after $max_attempts attempts" >&2
              return 1
            fi
            echo "git clone failed, retrying in ${delay}s (attempt $attempt/$max_attempts)..." >&2
            sleep $delay
            delay=$((delay * 2))
            attempt=$((attempt + 1))
          done
        }
        retry_git_clone https://gitlab.manjaro.org/tools/development-tools/manjaro-tools.git
        cd manjaro-tools
        sudo make SYSCONFDIR=/etc PREFIX=/usr
        sudo make SYSCONFDIR=/etc PREFIX=/usr install_base
        sudo make SYSCONFDIR=/etc PREFIX=/usr install_yaml
        sudo make SYSCONFDIR=/etc PREFIX=/usr install_iso
        if [ ! -z ${CUSTOM_REPO} ]; then
          echo "## adding repo [${CUSTOM_REPO}]"
          sudo sed -i -e "s/\[core\]/\[${CUSTOM_REPO}\]\nSigLevel = PackageRequired\nInclude = \/etc\/pacman\.d\/mirrorlist\n\n\[core\]/" /usr/share/manjaro-tools/pacman-multilib.conf
        fi

    - id: checkout-iso-profiles
      shell: bash
      env:
        REPO: ${{ inputs.iso-profiles-repo }}
        BRANCH: ${{ inputs.iso-profiles-branch }}
      run: |
        # Ensure script is LF-only
        if grep -q $'\r' "$0"; then
          exec bash -c "$(tr -d '\r' < "$0")" "$@"
        fi
        retry_git_clone() {
          local max_attempts=5 attempt=1 delay=10
          until sudo git clone --depth 1 "$@"; do
            if [ $attempt -ge $max_attempts ]; then
              echo "ERROR: git clone failed after $max_attempts attempts" >&2
              return 1
            fi
            echo "git clone failed, retrying in ${delay}s (attempt $attempt/$max_attempts)..." >&2
            sleep $delay
            delay=$((delay * 2))
            attempt=$((attempt + 1))
          done
        }
        retry_git_clone ${BRANCH:+--branch ${BRANCH}} ${REPO} iso-profiles

    - id: cleanup_space_workaround
      shell: bash
      run: |
        # Ensure script is LF-only
        if grep -q $'\r' "$0"; then
          exec bash -c "$(tr -d '\r' < "$0")" "$@"
        fi
        sudo apt-get clean
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"

    - id: image-build
      shell: bash
      env:
        EDITION: ${{ inputs.edition }}
        BRANCH: ${{ inputs.branch }}
        SCOPE: ${{ inputs.scope }}
        VERSION: ${{ inputs.version }}
        KERNEL: ${{ inputs.kernel }}
        CODE_NAME: ${{ inputs.code-name }}
        OFFICE: ${{ inputs.office-chooser }}
        BUILD_MIRROR: ${{ inputs.build-mirror }}
      run: |
        # Ensure script is LF-only
        if grep -q $'\r' "$0"; then
          exec bash -c "$(tr -d '\r' < "$0")" "$@"
        fi
        echo "## building iso"
        [ "$SCOPE" == "minimal" ] && unset SCOPE && unset OFFICE
        [ "$OFFICE" == "false" ] && unset OFFICE

        # source the version info from current release info (with retry)
        source <(curl --retry 5 --retry-delay 10 --retry-connrefused -s https://gitlab.manjaro.org/packages/core/manjaro-release/-/raw/master/lsb-release)

        sudo sed -i -e "s|dist_name=\$(get_distname)|dist_name=${DISTRIB_ID%Linux}|g" /usr/lib/manjaro-tools/util.sh
        sudo sed -i -e 's|iso_name=$(get_osid)|iso_name=manjaro|g' /usr/lib/manjaro-tools/util.sh
        sudo sed -i -e "s|dist_release=\$(get_release)|dist_release=${VERSION:-$DISTRIB_RELEASE}|g" /usr/lib/manjaro-tools/util.sh
        sudo sed -i -e "s|dist_codename=\$(get_codename)|dist_codename=\"${CODE_NAME:-$DISTRIB_CODENAME}\"|g" /usr/lib/manjaro-tools/util.sh
        sudo sed -i -e "s|build_mirror='https://mirror.easyname.at/manjaro'|build_mirror=\'${BUILD_MIRROR}\'|g" /usr/lib/manjaro-tools/util.sh
        
        sudo buildiso ${SCOPE:+-f} -p $EDITION -b $BRANCH -k $KERNEL ${OFFICE:+-o}

        sudo rm -Rf /var/lib/manjaro-tools/buildiso/*
        
        OUTPUT_ISO_PATH=$(find /var/cache/manjaro-tools/iso -type f -name "*.iso" -exec stat -c '%Y %n' {} \; | sort -nr | awk 'NR==1 {print $2}')
        TARGET_ISO_PATH=$(basename $OUTPUT_ISO_PATH)
        mv $OUTPUT_ISO_PATH ./$TARGET_ISO_PATH
        echo "file-path=$TARGET_ISO_PATH" >> $GITHUB_OUTPUT

        FILE_PKG=$(find /var/cache/manjaro-tools/iso -type f -name "*-pkgs.txt" -exec stat -c '%Y %n' {} \; | sort -nr | awk 'NR==1 {print $2}')
        mv $FILE_PKG ./${TARGET_ISO_PATH}.pkgs

    - id: hash
      shell: bash
      run: |
        echo "## calculating hashes"
        sha1sum ${{ steps.image-build.outputs.file-path }} >${{ steps.image-build.outputs.file-path }}.sha1
        sha256sum ${{ steps.image-build.outputs.file-path }} >${{ steps.image-build.outputs.file-path }}.sha256
        sha512sum ${{ steps.image-build.outputs.file-path }} >${{ steps.image-build.outputs.file-path }}.sha512

    - id: gpg_sign
      shell: bash
      run: |
        if [ -z "${{ inputs.gpg-secret-key-base64 }}" ]; then 
          echo "## no gpg secret given"
          exit 0
        fi
        echo "## gpg signing"
        cat <(echo -e "${{ inputs.gpg-secret-key-base64 }}" | base64 --decode) | gpg --batch --import &>/dev/null
        gpg --pinentry-mode loopback --passphrase "${{ inputs.gpg-passphrase }}" --detach-sign ./${{ steps.image-build.outputs.file-path }}

    - id: upload-prepare
      shell: bash -O extglob {0}
      run: |
        echo "## ssh setup"
        mkdir -p /home/runner/.ssh
        touch /home/runner/.ssh/github_actions
        chmod 600 /home/runner/.ssh/github_actions
        ssh-agent -a /tmp/ssh_agent.sock > /dev/null
        echo "upload-files=./${{ steps.image-build.outputs.file-path }}+(|.sha*|.pkgs|.sig|.torrent)" >> $GITHUB_OUTPUT
        mkdir -p ${{ inputs.edition }}/${{ inputs.version }}

    - name: upload-sourceforge
      shell: bash -O extglob {0}
      env:
        SSH_AUTH_SOCK: /tmp/ssh_agent.sock
      run: |
        if [ -z "${{ inputs.sf-project }}" ] || [ -z "${{ inputs.sf-user }}" ] || [ -z "${{ inputs.sf-key }}" ]; then 
          echo "## not (all) credentials given for sourceforge upload"
          exit 0
        fi
        echo "## sourceforge upload"
        
        ssh-keyscan -t rsa frs.sourceforge.net >> /home/runner/.ssh/known_hosts
        echo "${{ inputs.sf-key }}" >> /home/runner/.ssh/github_actions
        ssh-add /home/runner/.ssh/github_actions

        ## create target dir
        rsync -vaP --stats -e ssh ${{ inputs.edition }} \
          ${{ inputs.sf-user }}@frs.sourceforge.net:/home/frs/project/${{ inputs.sf-project }}/

        ## upload
        rsync -vaP --stats -e ssh ${{ steps.upload-prepare.outputs.upload-files }} \
          ${{ inputs.sf-user }}@frs.sourceforge.net:/home/frs/project/${{ inputs.sf-project }}/${{ inputs.edition }}/${{ inputs.version }}/

    - id: upload-github-release
      shell: bash -O extglob {0}
      env:
        LIMIT_MB: '2000'
      run: |
        if [ -z "${{ inputs.release-tag }}" ]; then 
          echo "## no release tag given"
          exit 0
        fi
        echo "## github upload"

        echo ${{ github.token }} | gh auth login --with-token
        gh release create ${{ inputs.release-tag }} --title ${{ inputs.release-tag }} --repo ${{ github.repository }} --notes "automated release" || echo "release already exists"

        GITHUB_LINK=https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ inputs.release-tag }}

        if [[ -z "$(du --threshold=${LIMIT_MB}M ${{ steps.image-build.outputs.file-path }})" ]]; then
          # iso is small enough to upload already
          gh release upload ${{ inputs.release-tag }} --repo ${{ github.repository }} --clobber \
            ${{ steps.upload-prepare.outputs.upload-files }}
        else
          # iso is too big - creating a split-zip
          zip -j -s ${LIMIT_MB}m ${{ steps.image-build.outputs.file-path }}.zip ${{ steps.image-build.outputs.file-path }}
          
          REMOTE_FILES=$(find . -maxdepth 1 -name "*.z*" -exec basename {} \; | xargs -I{} echo "-w \"${GITHUB_LINK}/{}\"")
          gh release upload ${{ inputs.release-tag }} --repo ${{ github.repository }} --clobber \
            ./${{ steps.image-build.outputs.file-path }}+(.z*|.sha*|.pkgs|.sig|.torrent)
        fi

    - name: upload-cdn77-s3
      shell: bash -O extglob {0}
      run: |
        if [ -z "${{ inputs.s3-cfg }}" ]; then
          echo "## credentials for cdn77 S3 upload not provided. Skipping."
          exit 0
        fi

        echo "## create torrent"
        mktorrent -v -a udp://tracker.opentrackr.org:1337 -l 21 \
          -w "https://download.manjaro.org/${{ inputs.edition }}/${{ inputs.version }}/${{ steps.image-build.outputs.file-path }}" \
          -o ${{ steps.image-build.outputs.file-path }}.torrent ${{ steps.image-build.outputs.file-path }}

        echo "## cdn77 S3 upload"
        # copy config
        echo "${{ inputs.s3-cfg }}" > /home/runner/.s3cfg
        # create bash array and mv files to dir
        upload_files=( "${{ steps.upload-prepare.outputs.upload-files }}" )
        for f in ${upload_files[@]}; do
          mv ${f} "${{ inputs.edition }}/${{ inputs.version }}/"
        done
        # upload
        s3cmd sync --progress --recursive -F "${{ inputs.edition }}" s3://s3downloadseu/
